{% load static %}


<div class="text-center border">
    <div class="overflow-hidden">
        {% if blog.thumbnail_image %}
        <img loading="lazy" src="{{ blog.thumbnail_image.url }}" height="200" width="400" class="duration-300 hover:scale-105"
            alt="{{ blog.title }}">
        {% else %}
        <img loading="lazy" src="{% static 'website/img/blog1.jpg' %}" height="200" width="400" class="duration-300 hover:scale-105"
            alt="{{ blog.title }}">
        {% endif %}
    </div>

    <div class="px-6 py-8">

        <a title="{{ block.title }}" href="{% url 'blog_category' blog.blog_category.generate_slug %}"
            class="flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                class="text-primary bi bi-tag-fill" viewBox="0 0 16 16">
                <path
                    d="M2 1a1 1 0 0 0-1 1v4.586a1 1 0 0 0 .293.707l7 7a1 1 0 0 0 1.414 0l4.586-4.586a1 1 0 0 0 0-1.414l-7-7A1 1 0 0 0 6.586 1H2zm4 3.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
            </svg>
            <span class="block text-lg text-primary">{{ blog.blog_category }}</span>
        </a>


        <div class="mt-3">
            <h3 class="text-xl font-bold">{{ blog.title }}</h3>
        </div>

        <div class="mt-8">
            <a href="{% url 'blog_detail' blog.slug  %}" class="btn" title="{{ blog.title }}">Read More</a>
        </div>
    </div>
</div>
