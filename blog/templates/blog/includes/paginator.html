{% if is_paginated %}

<nav class="container flex justify-center max-w-5xl mt-12" aria-label="Page navigation example">
    <ul class="flex items-center h-10 -space-x-px text-base">
        {% if page_obj.has_previous %}
        <li class="">
            <a class="flex items-center justify-center h-10 px-4 ml-0 leading-tight text-gray-500 bg-white border border-gray-300 rounded-l-lg hover:bg-gray-100 hover:text-gray-700 "
                tabindex="-1" href="?page={{ page_obj.previous_page_number }}">
                <svg class="w-2.5 h-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 6 10">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 1 1 5l4 4" />
                </svg>
            </a>
        </li>
        {% endif %}
        {% for i in paginator.page_range %}
        {% if page_obj.number == i %}
        <li class="page-item active">
            <a aria-current="page"
                class="flex items-center justify-center h-10 px-4 text-blue-600 border border-gray-300 bg-blue-50 hover:bg-blue-100 hover:text-blue-700 ">
                {{ i }} <span class="sr-only">(current)</span></a>
        </li>
        {% else %}
        <li><a class="flex items-center justify-center h-10 px-4 leading-tight text-gray-500 bg-white border border-gray-300 hover:bg-gray-100 hover:text-gray-700 "
                href="?page={{ i }}"> {{ i }} </a></li>
        {% endif %}
        {% endfor %}
        {% if page_obj.has_next %}
        <li>
            <a class="flex items-center justify-center h-10 px-4 leading-tight text-gray-500 bg-white border border-gray-300 rounded-r-lg hover:bg-gray-100 hover:text-gray-700 "
                href="?page={{ page_obj.next_page_number }}" class="page-link">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 6 10">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 9 4-4-4-4" />
                </svg>
            </a>
        </li>
        {% endif %}
    </ul>
</nav>

{% endif %}
