<select name="time" id="id_timeslots"
        class="w-full bg-transparent border border-secondary text-secondary text-sm rounded-lg focus:ring-primary focus:border-primary block  p-2.5">
    {% for time in timeslots %}
    <option selected="{% if not forloop.counter == 0 %}false{% endif %}" value="{{ time }}">{{ time }}</option>
    {% endfor %}
</select>
