{% load static %}

<!-- navbar -->
<div x-data="{navOpen: false, scrolledFromTop: false}"
  x-init="window.pageYOffset >= 50 ? scrolledFromTop = true : scrolledFromTop = false"
  @scroll.window="window.pageYOffset >= 50 ? scrolledFromTop = true : scrolledFromTop = false" :class="{
  'overflow-hidden': navOpen,
  'overflow-scroll': !navOpen
  }">
  <header
    class="fixed z-50 flex items-center justify-between w-full h-24 px-4 py-8 transition-all duration-300 bg-white shadow-sm md:px-12"
    :class="{'h-24': !scrolledFromTop, 'h-14': scrolledFromTop}">
    <a href="/">
      <img src="{% static 'develawp/img/develawp_logo.webp' %}" alt="Develawp Logo"
        class="h-5 transition duration-300 origin-left transform md:h-10"
        :class="{'scale-100': !scrolledFromTop, 'scale-75': scrolledFromTop}" />
    </a>
    <nav>
      <button class="md:hidden" @click="navOpen = !navOpen">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-secondary" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <ul
        class="fixed left-0 right-0 min-h-screen px-4 pt-8 space-y-4 font-semibold transition duration-300 transform translate-x-full md:relative md:flex md:space-x-10 md:min-h-0 md:px-0 md:py-0 md:space-y-0 md:translate-x-0"
        :class="{'translate-x-full': !navOpen}" :class="{'translate-x-0': navOpen}">
        <li class="">
          <a href="{% url 'develawp_home' %}" @click="navOpen = false">Home</a>
        </li>
        <li class="">
          <a href="{% url 'devalawp_courses_lists' %}" @click="navOpen = false">Courses</a>
        </li>
        <li>
          <a href="/#about" @click="navOpen = false">About</a>
        </li>
      </ul>
    </nav>
  </header>
</div>
<!-- navbar end -->
